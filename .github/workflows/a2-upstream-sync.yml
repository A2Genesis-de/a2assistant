name: A2 upstream sync

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream stable tag (vX.Y.Z); empty = newest"
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: a2-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'A2Genesis-de/hermes-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.A2_SYNC_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.A2_SYNC_TOKEN || github.token }}

      - name: Find the newest upstream stable release
        id: release
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --quiet --no-tags upstream "+refs/tags/v*:refs/tags/v*"
          tag="$TAG_INPUT"
          if [[ -z "$tag" ]]; then
            tag="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]{1,3}\.[0-9]+\.[0-9]+$' | head -n1)"
          fi
          current="$(git log -1 --format='%(trailers:key=A2-Upstream,valueonly)' --grep='^A2-Build: ' main | head -n1)"
          branch="sync/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == "$current" ]]; then
            echo "main is already built from $tag" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists; review its pull request" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0

      - name: Keep upstream release and deploy workflows disabled on the fork
        run: scripts/a2/disable-upstream-workflows.sh "$GITHUB_REPOSITORY"

      - name: Build the fork from upstream ${{ steps.release.outputs.tag }}
        if: steps.release.outputs.skip == 'false'
        run: |
          git config user.name "a2genesis-sync[bot]"
          git config user.email "a2genesis-sync[bot]@users.noreply.github.com"
          scripts/a2/sync-upstream.sh --tag "${{ steps.release.outputs.tag }}" --target "${{ steps.release.outputs.branch }}" --skip-tests

      - name: Test the build
        if: steps.release.outputs.skip == 'false'
        run: |
          git switch "${{ steps.release.outputs.branch }}"
          scripts/a2/test-build.sh

      - name: Open the pull request
        if: steps.release.outputs.skip == 'false'
        run: |
          git push origin "${{ steps.release.outputs.branch }}"
          gh pr create --base main --head "${{ steps.release.outputs.branch }}" \
            --title "Build A2 fork from upstream ${{ steps.release.outputs.tag }}" \
            --body "Upstream release ${{ steps.release.outputs.tag }} + A2 layer + generated brand layer, built by scripts/a2/sync-upstream.sh. Tests passed in the sync workflow. Merge with a fast-forward or merge commit, never squash: the merge commit's trailers are the build record."
